name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  cliweave:
    name: cliweave (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart test
        working-directory: packages/cliweave

  cliweave-shell-e2e:
    name: cliweave completion e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux bash-zsh-fish
            os: ubuntu-latest
            shells: bash,zsh,fish
          # macOS still ships bash 3.2, and its PATH finds Homebrew's bash 5
          # first, so the OS bash has to be pinned explicitly.
          - name: macos bash3.2-zsh-fish
            os: macos-26
            shells: bash,zsh,fish
            bash: /bin/bash
          - name: pwsh 7
            os: windows-2025
            shells: powershell
          # Windows PowerShell 5.1 runs on .NET Framework, where several
          # .NET Core-only overloads the script might reach for do not exist.
          - name: windows powershell 5.1
            os: windows-2025
            shells: powershell5
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fish zsh
      - if: runner.os == 'macOS'
        run: brew install fish
      - run: dart pub get
      - run: dart test -t e2e
        working-directory: packages/cliweave
        env:
          CLIWEAVE_E2E_SHELLS: ${{ matrix.shells }}
          CLIWEAVE_E2E_SHELL_BASH: ${{ matrix.bash }}

  dartage:
    name: dartage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart test -x interop
        working-directory: packages/dartage

  dartage-interop:
    name: dartage interop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/dartage/test/interop/pnpm-lock.yaml
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: pnpm install --frozen-lockfile
        working-directory: packages/dartage/test/interop
      - run: dart test -t interop
        working-directory: packages/dartage

  coverage:
    name: Package coverage (95% minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart test test/lcov_test.dart
      - run: dart run tool/verify_coverage.dart cliweave dartage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-coverage
          path: coverage
          if-no-files-found: error

  shipworld-coverage:
    name: shipworld coverage (95% minimum)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart run tool/verify_coverage.dart shipworld
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shipworld-coverage
          path: coverage
          if-no-files-found: error

  package-quality:
    name: Package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart doc
        working-directory: packages/cliweave
      - run: dart pub publish --dry-run
        working-directory: packages/cliweave
      - run: dart doc
        working-directory: packages/dartage
      - run: dart pub publish --dry-run
        working-directory: packages/dartage

  shipworld:
    name: shipworld (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart test
        working-directory: packages/shipworld

  shipworld-quality:
    name: shipworld quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart pub global activate pana 0.23.14
      - run: dart run packages/shipworld/tool/validate_standalone.dart

  shipworld-flutter-payload:
    name: shipworld flutter payload (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            payload: build/linux/x64/release/bundle
            launcher: shipworld_fixture
          - os: macos-26
            platform: macos
            payload: build/macos/Build/Products/Release/shipworld_fixture.app
            launcher: Contents/MacOS/shipworld_fixture
          - os: windows-2025
            platform: windows
            payload: build/windows/x64/runner/Release
            launcher: shipworld_fixture.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Generate platform runner
        run: flutter create --platforms=${{ matrix.platform }}
          --project-name=shipworld_fixture .
        working-directory: packages/shipworld/test/fixtures/flutter_app
      - name: Build Flutter desktop fixture
        run: flutter build ${{ matrix.platform }} --release
        working-directory: packages/shipworld/test/fixtures/flutter_app
      - name: Resolve Dart workspace dependencies
        run: dart pub get
      - name: Verify built directory payload
        run: dart run packages/shipworld/tool/verify_payload.dart
          "${{ github.workspace }}/packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}"
          "${{ matrix.launcher }}"
      - name: Build Windows x64 and arm64 MSIX packages
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SHIPWORLD_MSIX_NAME: shipworld.fixture
          SHIPWORLD_MSIX_PUBLISHER: CN=Shipworld
          SHIPWORLD_MSIX_PUBLISHER_NAME: Shipworld
        run: |
          $config = "packages/shipworld/test/fixtures/flutter_app/shipworld.yaml"
          $input = "packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}"
          dart run packages/shipworld/bin/shipworld.dart package windows msix fixture `
            --config $config --input $input --launcher shipworld_fixture.exe `
            --arch x64 --output dist/shipworld-fixture-x64.msix `
            --package-root .shipworld/msix/x64
          dart run packages/shipworld/bin/shipworld.dart package windows msix fixture `
            --config $config --input $input --launcher shipworld_fixture.exe `
            --arch arm64 --output dist/shipworld-fixture-arm64.msix `
            --package-root .shipworld/msix/arm64
          dart run packages/shipworld/bin/shipworld.dart package windows bundle fixture `
            --config $config --package-dir dist `
            --output dist/shipworld-fixture.msixbundle `
            --working-directory .shipworld/msix/bundle
          tar -tf packages/shipworld/test/fixtures/flutter_app/dist/shipworld-fixture-x64.msix |
            Select-String AppxManifest.xml
      - name: Sign and archive the macOS application
        if: matrix.platform == 'macos'
        run: |
          config=packages/shipworld/test/fixtures/flutter_app/shipworld.yaml
          input=packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}
          output=packages/shipworld/test/fixtures/flutter_app/dist/ShipworldFixture.zip
          mkdir -p "$(dirname "$output")"
          dart run packages/shipworld/bin/shipworld.dart package macos sign fixture \
            --config "$config" --input "$input" --app-bundle --skip-notarize
          dart run packages/shipworld/bin/shipworld.dart package macos archive fixture \
            --config "$config" --input "$input" --output "$output"
          codesign --verify --deep --strict "$input"
          unzip -l "$output" | grep shipworld_fixture.app
      - name: Install verified appimagetool for the Flutter fixture
        if: matrix.platform == 'linux'
        run: |
          curl --fail --location --output appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimagetool" |
            sha256sum --check -
          chmod +x appimagetool
      - name: Build and inspect the Flutter AppImage
        if: matrix.platform == 'linux'
        run: |
          config=packages/shipworld/test/fixtures/flutter_app/shipworld.yaml
          input=packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}
          dart run packages/shipworld/bin/shipworld.dart package linux appimage fixture \
            --config "$config" --input "$input" --launcher shipworld_fixture \
            --output dist/ShipworldFixture.AppImage --arch x86_64 \
            --tool "${{ github.workspace }}/appimagetool"
          artifact=packages/shipworld/test/fixtures/flutter_app/dist/ShipworldFixture.AppImage
          test -x "$artifact"
          "$artifact" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/shipworld_fixture
      - name: Validate Formula and Cask rendering
        if: matrix.platform == 'linux'
        run: |
          fixture=packages/shipworld/test/fixtures/flutter_app
          mkdir -p "$fixture/formula-artifacts"
          for name in shipworld-fixture-macos-arm64 shipworld-fixture-macos-x64 \
            shipworld-fixture-linux-arm64 shipworld-fixture-linux-x64; do
            printf '%s\n' "$name" > "$fixture/formula-artifacts/$name"
          done
          printf 'archive\n' > "$fixture/ShipworldFixture.zip"
          dart run packages/shipworld/bin/shipworld.dart package homebrew formula fixture \
            --config "$fixture/shipworld.yaml" \
            --artifacts-dir "$fixture/formula-artifacts" \
            --output "$fixture/shipworld-fixture.rb"
          dart run packages/shipworld/bin/shipworld.dart package homebrew cask fixture \
            --config "$fixture/shipworld.yaml" \
            --archive "$fixture/ShipworldFixture.zip" \
            --url https://example.invalid/ShipworldFixture.zip \
            --output "$fixture/shipworld-fixture-cask.rb"
          ruby -c "$fixture/shipworld-fixture.rb"
          ruby -c "$fixture/shipworld-fixture-cask.rb"
