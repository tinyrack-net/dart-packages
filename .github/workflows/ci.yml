name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos

  cliweave:
    name: cliweave (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart test
        working-directory: packages/cliweave

  cliweave-shell-e2e:
    name: cliweave completion e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bash-zsh-fish
            os: ubuntu-latest
            shells: bash,zsh,fish
          - name: powershell
            os: windows-2025
            shells: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fish zsh
      - run: dart pub get
      - run: dart test -t e2e
        working-directory: packages/cliweave
        env:
          CLIWEAVE_E2E_SHELLS: ${{ matrix.shells }}

  dartage:
    name: dartage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart test -x interop
        working-directory: packages/dartage

  dartage-interop:
    name: dartage interop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/dartage/test/interop/pnpm-lock.yaml
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: pnpm install --frozen-lockfile
        working-directory: packages/dartage/test/interop
      - run: dart test -t interop
        working-directory: packages/dartage

  coverage:
    name: Package coverage (95% minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart test test/lcov_test.dart
      - run: dart run tool/verify_coverage.dart
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-coverage
          path: coverage
          if-no-files-found: error

  package-quality:
    name: Package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - run: dart pub get
      - run: dart doc
        working-directory: packages/cliweave
      - run: dart pub publish --dry-run
        working-directory: packages/cliweave
      - run: dart doc
        working-directory: packages/dartage
      - run: dart pub publish --dry-run
        working-directory: packages/dartage
