name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A cancelled merge-queue check reads as a failure and ejects the pull
  # request from the queue, so those runs always finish.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  # Every package job is gated on this one, and only on this one. `Quality Gate`
  # relies on that: it accepts a skipped job only because a skip cannot mean
  # anything other than "this package was untouched".
  affected:
    name: Affected packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cliweave: ${{ steps.detect.outputs.cliweave }}
      dartage: ${{ steps.detect.outputs.dartage }}
      ptyworld: ${{ steps.detect.outputs.ptyworld }}
      shipworld: ${{ steps.detect.outputs.shipworld }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `git diff` below needs the pull request's base commit, which a
          # shallow clone does not have.
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          # `tool/affected_packages.dart` imports nothing outside `dart:`, so it
          # runs straight from the checkout and keeps this job off the critical
          # path.
          pub-get: "false"
      - id: detect
        name: Detect affected packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA...$HEAD_SHA" > changed-files.txt
            cat changed-files.txt
            dart run tool/affected_packages.dart --changed-files changed-files.txt
          else
            # `push` to main and `merge_group` always run everything. The queue
            # re-resolves dependencies against a moving `main` with no committed
            # `pubspec.lock`, so a narrowed run there is exactly the one that
            # would miss a break.
            dart run tool/affected_packages.dart --all
          fi

  analyze:
    name: Analyze
    # Repository-wide and cheap, so it is not gated on the affected packages.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      # The root workspace package's own tests: the coverage parser and the
      # affected-package graph that gates every job below.
      - run: dart test

  cliweave:
    name: cliweave (${{ matrix.os }})
    needs: affected
    if: needs.affected.outputs.cliweave == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            coverage: true
          - os: macos-26
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - if: ${{ !matrix.coverage }}
        run: dart test
        working-directory: packages/cliweave
      # `verify_coverage.dart` runs the same suite with the same exclusions, so
      # the coverage leg replaces the plain run instead of repeating it.
      - if: matrix.coverage
        run: dart run tool/verify_coverage.dart cliweave
      - if: ${{ always() && matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cliweave
          path: coverage
          if-no-files-found: error

  cliweave-shell-e2e:
    name: cliweave completion e2e (${{ matrix.name }})
    needs: affected
    if: needs.affected.outputs.cliweave == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # These names are no longer required status checks, so renaming one
          # only changes what the run displays. `Quality Gate` is the single
          # check main requires, and renaming that one does break merging.
          - name: bash-zsh-fish
            os: ubuntu-24.04
            shells: bash,zsh,fish
          - name: powershell
            os: windows-2025
            shells: powershell
          # macOS still ships bash 3.2, and its PATH finds Homebrew's bash 5
          # first, so the OS bash has to be pinned explicitly.
          - name: macos-bash3.2-zsh-fish
            os: macos-26
            shells: bash,zsh,fish
            bash: /bin/bash
          # Windows PowerShell 5.1 runs on .NET Framework and is still the
          # default shell there, so it needs its own lane alongside pwsh 7.
          - name: powershell5.1
            os: windows-2025
            shells: powershell5
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fish zsh
      - if: runner.os == 'macOS'
        run: brew install fish
      - uses: ./.github/actions/setup-workspace
      - run: dart test -t e2e
        working-directory: packages/cliweave
        env:
          CLIWEAVE_E2E_SHELLS: ${{ matrix.shells }}
          CLIWEAVE_E2E_SHELL_BASH: ${{ matrix.bash }}

  cliweave-quality:
    name: cliweave quality
    needs: affected
    if: needs.affected.outputs.cliweave == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: dart doc
        working-directory: packages/cliweave
      - run: dart pub publish --dry-run
        working-directory: packages/cliweave

  dartage:
    name: dartage (${{ matrix.os }})
    needs: affected
    if: needs.affected.outputs.dartage == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            coverage: true
          - os: macos-26
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - if: ${{ !matrix.coverage }}
        run: dart test -x interop
        working-directory: packages/dartage
      - if: matrix.coverage
        run: dart run tool/verify_coverage.dart dartage
      - if: ${{ always() && matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-dartage
          path: coverage
          if-no-files-found: error

  dartage-interop:
    name: dartage interop (${{ matrix.os }})
    needs: affected
    if: needs.affected.outputs.dartage == 'true'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/dartage/test/interop/pnpm-lock.yaml
      - uses: ./.github/actions/setup-workspace
      - run: pnpm install --frozen-lockfile
        working-directory: packages/dartage/test/interop
      - run: dart test -t interop
        working-directory: packages/dartage

  dartage-quality:
    name: dartage quality
    needs: affected
    if: needs.affected.outputs.dartage == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: dart doc
        working-directory: packages/dartage
      - run: dart pub publish --dry-run
        working-directory: packages/dartage

  ptyworld:
    name: ptyworld (${{ matrix.os }})
    needs: affected
    if: needs.affected.outputs.ptyworld == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            coverage: true
          - os: macos-26
          - os: windows-2025
    runs-on: ${{ matrix.os }}
    # The suite spawns real terminals and waits on child processes; the Windows
    # ConPTY cases are the slowest in this repository.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No C toolchain setup: `hook/build.dart` finds clang/gcc on Linux, the
      # Xcode command line tools on macOS, and MSVC through vswhere on Windows.
      # `-lutil` and <pty.h> come from libc6-dev, present on the Ubuntu image.
      - uses: ./.github/actions/setup-workspace
      - if: ${{ !matrix.coverage }}
        run: dart test
        working-directory: packages/ptyworld
      - if: matrix.coverage
        run: dart run tool/verify_coverage.dart ptyworld
      - if: ${{ always() && matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ptyworld
          path: coverage
          if-no-files-found: error

  shipworld:
    name: shipworld (${{ matrix.os }})
    needs: affected
    if: needs.affected.outputs.shipworld == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: macos-26
          # Coverage is measured on Windows: shipworld's Windows SDK-tool
          # discovery is guarded by `Platform.isWindows`, so those branches only
          # execute here and the 95% gate is only reachable on this leg.
          - os: windows-2025
            coverage: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - if: ${{ !matrix.coverage }}
        run: dart test
        working-directory: packages/shipworld
      - if: matrix.coverage
        run: dart run tool/verify_coverage.dart shipworld
      - if: ${{ always() && matrix.coverage }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shipworld
          path: coverage
          if-no-files-found: error

  shipworld-quality:
    name: shipworld quality
    needs: affected
    if: needs.affected.outputs.shipworld == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: dart pub global activate pana 0.23.14
      - run: dart run packages/shipworld/tool/validate_standalone.dart

  shipworld-homebrew-render:
    name: shipworld homebrew render
    needs: affected
    if: needs.affected.outputs.shipworld == 'true'
    # Formula and Cask rendering only reads artifact names and hashes, so it
    # runs against fabricated files and does not wait on a Flutter build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - name: Validate Formula and Cask rendering
        run: |
          fixture=packages/shipworld/test/fixtures/flutter_app
          mkdir -p "$fixture/formula-artifacts"
          # The fixture target declares a directory payload, so its Homebrew
          # artifacts are archives rather than bare executables, and it lists
          # three platforms rather than all four.
          for name in shipworld-fixture-macos-arm64 shipworld-fixture-macos-x64 \
            shipworld-fixture-linux-x64; do
            printf '%s\n' "$name" > "$fixture/formula-artifacts/$name.tar.gz"
          done
          printf 'archive\n' > "$fixture/ShipworldFixture.zip"
          dart run packages/shipworld/bin/shipworld.dart package homebrew formula fixture \
            --config "$fixture/shipworld.yaml" \
            --artifacts-dir "$fixture/formula-artifacts" \
            --output "$fixture/shipworld-fixture.rb"
          dart run packages/shipworld/bin/shipworld.dart package homebrew cask fixture \
            --config "$fixture/shipworld.yaml" \
            --archive "$fixture/ShipworldFixture.zip" \
            --url https://example.invalid/ShipworldFixture.zip \
            --output "$fixture/shipworld-fixture-cask.rb"
          ruby -c "$fixture/shipworld-fixture.rb"
          ruby -c "$fixture/shipworld-fixture-cask.rb"

  shipworld-flutter-payload:
    name: shipworld flutter payload (${{ matrix.platform }})
    needs: affected
    if: needs.affected.outputs.shipworld == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            payload: build/linux/x64/release/bundle
            launcher: shipworld_fixture
          - os: macos-26
            platform: macos
            payload: build/macos/Build/Products/Release/shipworld_fixture.app
            launcher: Contents/MacOS/shipworld_fixture
          - os: windows-2025
            platform: windows
            payload: build/windows/x64/runner/Release
            launcher: shipworld_fixture.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # This job uses the Dart SDK bundled with Flutter rather than the shared
      # workspace setup, so the fixture builds against one toolchain.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Generate platform runner
        run: flutter create --platforms=${{ matrix.platform }}
          --project-name=shipworld_fixture .
        working-directory: packages/shipworld/test/fixtures/flutter_app
      - name: Build Flutter desktop fixture
        run: flutter build ${{ matrix.platform }} --release
        working-directory: packages/shipworld/test/fixtures/flutter_app
      - name: Resolve Dart workspace dependencies
        run: dart pub get
      - name: Verify built directory payload
        run: dart run packages/shipworld/tool/verify_payload.dart
          "${{ github.workspace }}/packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}"
          "${{ matrix.launcher }}"
      - name: Build Windows x64 and arm64 MSIX packages
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SHIPWORLD_MSIX_NAME: shipworld.fixture
          SHIPWORLD_MSIX_PUBLISHER: CN=Shipworld
          SHIPWORLD_MSIX_PUBLISHER_NAME: Shipworld
        run: |
          $config = "packages/shipworld/test/fixtures/flutter_app/shipworld.yaml"
          $input = "packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}"
          dart run packages/shipworld/bin/shipworld.dart package windows msix fixture `
            --config $config --input $input --launcher shipworld_fixture.exe `
            --arch x64 --output dist/shipworld-fixture-x64.msix `
            --package-root .shipworld/msix/x64
          dart run packages/shipworld/bin/shipworld.dart package windows msix fixture `
            --config $config --input $input --launcher shipworld_fixture.exe `
            --arch arm64 --output dist/shipworld-fixture-arm64.msix `
            --package-root .shipworld/msix/arm64
          dart run packages/shipworld/bin/shipworld.dart package windows bundle fixture `
            --config $config --package-dir dist `
            --output dist/shipworld-fixture.msixbundle `
            --working-directory .shipworld/msix/bundle
          tar -tf packages/shipworld/test/fixtures/flutter_app/dist/shipworld-fixture-x64.msix |
            Select-String AppxManifest.xml
      - name: Sign and archive the macOS application
        if: matrix.platform == 'macos'
        run: |
          config=packages/shipworld/test/fixtures/flutter_app/shipworld.yaml
          input=packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}
          output=packages/shipworld/test/fixtures/flutter_app/dist/ShipworldFixture.zip
          mkdir -p "$(dirname "$output")"
          dart run packages/shipworld/bin/shipworld.dart package macos sign fixture \
            --config "$config" --input "$input" --app-bundle --skip-notarize
          dart run packages/shipworld/bin/shipworld.dart package macos archive fixture \
            --config "$config" --input "$input" --output "$output"
          codesign --verify --deep --strict "$input"
          unzip -l "$output" | grep shipworld_fixture.app
      - name: Install verified appimagetool for the Flutter fixture
        if: matrix.platform == 'linux'
        run: |
          curl --fail --location --output appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          echo "a6d71e2b6cd66f8e8d16c37ad164658985e0cf5fcaa950c90a482890cb9d13e0  appimagetool" |
            sha256sum --check -
          chmod +x appimagetool
      - name: Build and inspect the Flutter AppImage
        if: matrix.platform == 'linux'
        run: |
          config=packages/shipworld/test/fixtures/flutter_app/shipworld.yaml
          input=packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}
          dart run packages/shipworld/bin/shipworld.dart package linux appimage fixture \
            --config "$config" --input "$input" --launcher shipworld_fixture \
            --output dist/ShipworldFixture.AppImage --arch x86_64 \
            --tool "${{ github.workspace }}/appimagetool"
          artifact=packages/shipworld/test/fixtures/flutter_app/dist/ShipworldFixture.AppImage
          test -x "$artifact"
          "$artifact" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/shipworld_fixture
      - name: Install verified nfpm and rpm for the Flutter fixture
        if: matrix.platform == 'linux'
        run: |
          curl --fail --location --output nfpm.deb \
            https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          echo "3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97  nfpm.deb" |
            sha256sum --check -
          sudo dpkg -i nfpm.deb
          sudo apt-get install -y rpm
      - name: Build and install the Flutter deb and rpm
        if: matrix.platform == 'linux'
        run: |
          config=packages/shipworld/test/fixtures/flutter_app/shipworld.yaml
          input=packages/shipworld/test/fixtures/flutter_app/${{ matrix.payload }}
          root=packages/shipworld/test/fixtures/flutter_app
          for format in deb rpm; do
            dart run packages/shipworld/bin/shipworld.dart package linux "$format" fixture \
              --config "$config" --input "$input" --launcher shipworld_fixture \
              --output "dist/shipworld-fixture.$format" --arch amd64
          done
          dpkg-deb --info "$root/dist/shipworld-fixture.deb"
          dpkg-deb --contents "$root/dist/shipworld-fixture.deb" |
            grep 'usr/bin/shipworld_fixture ->'
          rpm -qpl "$root/dist/shipworld-fixture.rpm" |
            grep 'usr/lib/shipworld-fixture/shipworld_fixture'
          # A package that builds but cannot install is the failure mode the
          # rendering tests cannot see.
          sudo dpkg -i "$root/dist/shipworld-fixture.deb"
          test -x /usr/bin/shipworld_fixture
          sudo dpkg -r shipworld-fixture

  quality-gate:
    name: Quality Gate
    # A job that a failed dependency skips still publishes a check run, and
    # branch protection reads a skipped one as a pass, so the gate has to run
    # unconditionally to stay fail-closed.
    if: always()
    needs:
      # Every job above belongs here. One left out is silently exempt from the
      # only status check main requires.
      - affected
      - analyze
      - cliweave
      - cliweave-shell-e2e
      - cliweave-quality
      - dartage
      - dartage-interop
      - dartage-quality
      - ptyworld
      - shipworld
      - shipworld-quality
      - shipworld-homebrew-render
      - shipworld-flutter-payload
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed or be skipped
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: |
          # `affected` must have succeeded. Given that, no other job can be
          # skipped for any reason except its own package being untouched:
          # `needs.affected` is the only thing their `if:` conditions read. Add
          # a second `needs` to one of them and this stops being true.
          jq -e '.affected.result == "success"' <<< "$QUALITY_RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            <<< "$QUALITY_RESULTS"
