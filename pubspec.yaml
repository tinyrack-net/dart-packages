name: dart_packages_workspace
publish_to: none

# Flutter 3.47 ships Dart 3.13.0. Keep the workspace and every member on the
# matching language version so Dart CI and Flutter payload builds share a floor.
environment:
  sdk: ^3.13.0

workspace:
  - packages/cliweave
  - packages/dartage
  - packages/lua_tool_runtime
  - packages/ptyworld
  - packages/shipworld
  - packages/tinyrack_workspace
  - packages/vtworld

dev_dependencies:
  test: ^1.32.0

# pqcrypto 0.4.1's published archive omits a file referenced by its own
# dartdoc_options.yaml. Keep workspace documentation checks reproducible while
# dartage requires the latest published dependency for consumers.
dependency_overrides:
  pqcrypto: 0.4.0
