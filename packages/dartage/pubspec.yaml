name: dartage
description: >-
  Pure Dart implementation of the age v1 file encryption format with X25519
  recipients: encrypt, decrypt, ASCII armor, and identity/recipient key
  handling, verified against the reference implementation.
version: 0.1.0
resolution: workspace
repository: https://github.com/tinyrack-net/dart-packages
issue_tracker: https://github.com/tinyrack-net/dart-packages/issues
topics:
  - age
  - encryption
  - cryptography

environment:
  sdk: ^3.12.0

dependencies:
  cryptography: ^2.7.0

dev_dependencies:
  lints: ^6.0.0
  path: ^1.9.0
  test: ^1.26.0
