name: cliweave
description: >-
  A typed CLI framework: command routing, argument scanning with kebab/camel
  aliasing, did-you-mean suggestions, rendered help, structured exit codes,
  shell-completion proposals, and a terminal logger, spinner, and colour theme.
version: 0.1.1
resolution: workspace
repository: https://github.com/tinyrack-net/dart-packages
issue_tracker: https://github.com/tinyrack-net/dart-packages/issues
topics:
  - cli
  - command-line
  - argument-parser
  - shell-completion

environment:
  sdk: ^3.12.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
