name: shipworld
description: >-
  Reusable release, signing, and desktop packaging tooling for Dart CLI,
  Flutter desktop, and independently versioned pub package workspaces.
version: 0.3.0
resolution: workspace
repository: https://github.com/tinyrack-net/dart-packages
issue_tracker: https://github.com/tinyrack-net/dart-packages/issues
topics:
  - release
  - packaging
  - cli
  - desktop

environment:
  sdk: ^3.13.0

executables:
  shipworld: shipworld

dependencies:
  archive: ^4.2.0
  cliweave: '>=0.2.2 <0.4.0'
  crypto: ^3.0.7
  path: ^1.9.1
  pub_semver: ^2.2.1
  yaml: ^3.1.4
  yaml_edit: ^2.2.4

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0
