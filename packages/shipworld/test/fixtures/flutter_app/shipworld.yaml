schema: 1
remote: origin
batch-commit: "release: {targets}"

targets:
  fixture:
    kind: flutter-application
    root: .
    version:
      source: pubspec.yaml
    tag: "fixture-v{version}"
    commit: "release: fixture {version}"
    branch: main
    payload:
      kind: directory
      launcher: shipworld_fixture
    product:
      name: shipworld-fixture
      display-name: Shipworld Fixture
      description: Shipworld Flutter desktop integration fixture
      executable: shipworld_fixture
      homepage: https://example.invalid/shipworld
      repository: example/shipworld-fixture
    windows:
      application-id: ShipworldFixture
      executable: shipworld_fixture.exe
      identity:
        name-env: SHIPWORLD_MSIX_NAME
        publisher-env: SHIPWORLD_MSIX_PUBLISHER
        publisher-display-name-env: SHIPWORLD_MSIX_PUBLISHER_NAME
    macos:
      entitlements: entitlements.plist
    linux:
      icon: icon.svg
      categories:
        - Utility
      terminal: false
      maintainer: "Shipworld <dev@example.invalid>"
      license: MIT
      app-id: invalid.example.shipworld
      icons:
        - { size: 0, path: icon.svg }
      deb:
        depends: [libgtk-3-0t64]
      rpm:
        requires: [gtk3]
    homebrew:
      formula-class: ShipworldFixture
      artifact-prefix: shipworld-fixture
